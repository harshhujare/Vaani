[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanisetu-recommendation-engine"
version = "1.0.0"
description = "AI Voice Assistant for Livelihood Mapping & NSQF-Aligned Skilling (PM-AJAY GIA) — Layer 2 Recommendation Engine"
readme = "services/recommendation_engine/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Team VaniSetu"}
]
keywords = [
    "pm-ajay",
    "nsqf",
    "recommendation-engine",
    "skilling",
    "fastapi",
    "livelihood-mapping",
    "deterministic-scoring"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
ai = [
    "openai>=1.0.0",
]
all = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "openai>=1.0.0",
]

[project.scripts]
vanisetu-demo = "services.recommendation_engine.demo:main"

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["services/recommendation_engine/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
